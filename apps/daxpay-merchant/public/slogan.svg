<svg width="380" height="380" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg">
  <!-- 商户端登录插画: 收款码台牌 + 收款手机 + 经营数据卡片, 全图形化无文字(语言无关, 各语种共用) -->
  <g transform="translate(-8, 0)">
    <!-- 地面阴影与地平线 -->
    <ellipse cx="196" cy="346" rx="158" ry="14" fill="#474747" opacity="0.05"/>
    <path d="M 40 344 L 352 344" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round"/>

    <!-- 顶部收款播报声波(青绿三弧, 透明度递减) -->
    <path d="M 105.3 51.3 A 8 8 0 0 1 120.7 51.3" stroke="#33b6bb" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 99.1 45.1 A 14 14 0 0 1 126.9 45.1" stroke="#33b6bb" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M 92.9 38.9 A 20 20 0 0 1 133.1 38.9" stroke="#33b6bb" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.32"/>

    <!-- 右上经营数据卡片(背景层, 被码牌遮一角形成层次) -->
    <g>
      <rect x="195" y="36" width="130" height="80" rx="10" fill="#ffffff" stroke="#ececec" stroke-width="1.5"/>
      <rect x="207" y="48" width="36" height="7" rx="3.5" fill="#e0e0e0"/>
      <rect x="207" y="88" width="10" height="20" rx="2" fill="#e0e0e0"/>
      <rect x="223" y="78" width="10" height="30" rx="2" fill="#ffc522"/>
      <rect x="239" y="70" width="10" height="38" rx="2" fill="#f4a62a"/>
      <path d="M 258 92 L 272 76 L 284 82 L 298 60 L 310 64" stroke="#ff503e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="298" cy="60" r="4" fill="#ff503e"/>
    </g>

    <!-- 左侧商户手机(收款到账, 屏幕全符号化) -->
    <g>
      <rect x="48" y="95" width="132" height="250" rx="24" fill="#ffffff" stroke="#e8e8e8" stroke-width="1.5"/>
      <rect x="95" y="102" width="38" height="5" rx="2.5" fill="#e0e0e0"/>
      <rect x="58" y="113" width="112" height="214" rx="14" fill="#f0f5fa"/>
      <!-- 中央货币符号(手绘 ¥, 金色) -->
      <g stroke="#f4a62a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 102 155 L 114 173 L 126 155"/>
        <path d="M 114 173 L 114 195"/>
        <path d="M 104 182 L 124 182"/>
        <path d="M 104 190 L 124 190"/>
      </g>
      <path d="M 76 222 L 152 222" stroke="#e2e9f2" stroke-width="1.5" stroke-linecap="round"/>
      <!-- 底部经营趋势三柱(上升) -->
      <rect x="88" y="272" width="12" height="18" rx="2" fill="#e0e0e0"/>
      <rect x="108" y="262" width="12" height="28" rx="2" fill="#ffc522"/>
      <rect x="128" y="252" width="12" height="38" rx="2" fill="#f4a62a"/>
    </g>

    <!-- 收款成功浮动气泡(压在手机右上角, 绿色对勾) -->
    <g>
      <circle cx="188" cy="102" r="17" fill="#34c77b" stroke="#ffffff" stroke-width="3"/>
      <path d="M 181 102 L 186 107 L 196 96" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- 右侧收款码台牌(主体前景) -->
    <g>
      <!-- 支杆与底座 -->
      <rect x="281" y="295" width="18" height="16" fill="#8c8c8c"/>
      <rect x="240" y="308" width="100" height="12" rx="6" fill="#d9d9d9"/>
      <ellipse cx="290" cy="310" rx="50" ry="8" fill="#e8e8e8"/>
      <!-- 牌体 -->
      <rect x="225" y="80" width="130" height="215" rx="16" fill="#ffffff" stroke="#ececec" stroke-width="1.5"/>
      <!-- 顶部挂牌条(白色扫码框图标, 语言无关) -->
      <rect x="233" y="88" width="114" height="30" rx="8" fill="#ff503e"/>
      <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M 279 98 L 279 92 L 285 92"/>
        <path d="M 295 92 L 301 92 L 301 98"/>
        <path d="M 279 108 L 279 114 L 285 114"/>
        <path d="M 295 114 L 301 114 L 301 108"/>
        <path d="M 284 103 L 296 103"/>
      </g>
      <!-- 二维码三个定位角(外框) -->
      <g fill="none" stroke="#474747" stroke-width="5">
        <rect x="246" y="146" width="24" height="24" rx="5"/>
        <rect x="306" y="146" width="24" height="24" rx="5"/>
        <rect x="246" y="204" width="24" height="24" rx="5"/>
      </g>
      <!-- 二维码三个定位角(内芯) -->
      <g fill="#474747">
        <rect x="253" y="153" width="10" height="10" rx="2"/>
        <rect x="313" y="153" width="10" height="10" rx="2"/>
        <rect x="253" y="211" width="10" height="10" rx="2"/>
      </g>
      <!-- 二维码中心与右下数据点 -->
      <g fill="#474747">
        <rect x="282" y="182" width="13" height="13" rx="3"/>
        <rect x="307" y="203" width="13" height="13" rx="3"/>
        <rect x="280" y="203" width="8" height="8" rx="2"/>
      </g>
      <!-- 牌面底部装饰条 -->
      <rect x="275" y="252" width="30" height="8" rx="4" fill="#e0e0e0"/>
    </g>

    <!-- 点缀: 金色闪光星 / 青绿圆点 / 白色加号 -->
    <path d="M 210 48 C 212 58 216 62 226 64 C 216 66 212 70 210 80 C 208 70 204 66 194 64 C 204 62 208 58 210 48 Z" fill="#ffc522"/>
    <circle cx="346" cy="42" r="5" fill="#6be8d3"/>
    <path d="M 368 130 L 368 146 M 360 138 L 376 138" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M 34 200 L 34 212 M 28 206 L 40 206" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
